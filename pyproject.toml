[project]
name = "arize-fde-agent"
version = "0.1.0"
description = "A simple AI travel agent (CLI + FastAPI) built on the Anthropic API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.116.0",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "uvicorn[standard]==0.51.0",
    "arize-phoenix-client==3.5.0",
    "arize-phoenix-evals==3.8.0",
    "arize-phoenix-otel==0.17.1",
    "openinference-instrumentation-anthropic==1.1.2",
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "aiosmtpd==1.4.6",
    "psutil==7.2.2",
    "spacy==3.8.16",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.7"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "quality"]
