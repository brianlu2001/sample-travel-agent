apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-quality
resources:
  - namespace.yaml
  - config.yaml
  - api.yaml
  - workers.yaml
# Replace with your registry image digest before applying. Never reuse this tag
# for different code: all four deployments must use one measured image version.
images:
  - name: travel-quality
    newName: travel-quality
    newTag: local
